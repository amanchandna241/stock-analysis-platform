apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: alphiq-backend-vpa
  namespace: alphiq-prod
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphiq-backend
  updatePolicy:
    # "Off" mode = Recommendation Only.
    # CRITICAL: Prevents race conditions with HPA (which scales on CPU).
    # Allows VPA to suggest exact CPU/memory sizing based on 8-day rolling window
    # without restarting pods during trading hours.
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: fastapi-engine
        minAllowed:
          cpu: "250m"
          memory: "384Mi"
        maxAllowed:
          cpu: "4000m"
          memory: "4096Mi"
        controlledResources: ["cpu", "memory"]
