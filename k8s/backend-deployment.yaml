apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphiq-backend
  namespace: alphiq-prod
  labels:
    app: alphiq-backend
    tier: api
spec:
  replicas: 3 # Baseline minimum across 3 Availability Zones
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0 # Zero downtime deployments
  selector:
    matchLabels:
      app: alphiq-backend
  template:
    metadata:
      labels:
        app: alphiq-backend
        tier: api
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - alphiq-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: fastapi-engine
          image: alphiq/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PROJECT_NAME
              value: "Alphiq AI Equity Research Engine"
            - name: ENVIRONMENT
              value: "production"
          resources:
            requests:
              cpu: "500m"     # 0.5 vCPU reserved
              memory: "512Mi"  # TF-IDF index & Python runtime
            limits:
              cpu: "1000m"    # 1.0 vCPU burst limit (avoids CPU throttling)
              memory: "1024Mi" # Memory ceiling (triggers OOM before host impact)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: alphiq-backend-svc
  namespace: alphiq-prod
  labels:
    app: alphiq-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
      protocol: TCP
  selector:
    app: alphiq-backend
