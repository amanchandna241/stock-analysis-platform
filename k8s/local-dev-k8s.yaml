# Standalone single-file local test manifest for Minikube / Kind / Docker Desktop
apiVersion: v1
kind: Namespace
metadata:
  name: alphiq-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphiq-backend
  namespace: alphiq-local
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alphiq-backend
  template:
    metadata:
      labels:
        app: alphiq-backend
    spec:
      containers:
        - name: fastapi-engine
          image: python:3.10-slim
          command: ["sh", "-c", "pip install fastapi uvicorn && python -c 'import uvicorn, os; from fastapi import FastAPI; app=FastAPI(); app.get(\"/health\")(lambda: {\"status\":\"healthy\"}); uvicorn.run(app, host=\"0.0.0.0\", port=8000)'"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: alphiq-backend-hpa
  namespace: alphiq-local
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: alphiq-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
