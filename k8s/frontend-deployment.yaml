apiVersion: apps/v1
kind: Deployment
metadata:
  name: alphiq-frontend
  namespace: alphiq-prod
  labels:
    app: alphiq-frontend
    tier: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: alphiq-frontend
  template:
    metadata:
      labels:
        app: alphiq-frontend
        tier: web
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: nextjs-web
          image: alphiq/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "http://alphiq-backend-svc.alphiq-prod.svc.cluster.local:8000/api/v1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: alphiq-frontend-svc
  namespace: alphiq-prod
  labels:
    app: alphiq-frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: alphiq-frontend
